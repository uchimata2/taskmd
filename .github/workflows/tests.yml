# Runs this repository's own test suite (T-116).
#
# It is not part of what an install copies: `plugin/` is the plugin boundary (T-053), and
# nothing in this file reaches an adopter.
#
# It is GREEN, and every failure is now a regression. It did not start that way, and the two
# days of history are short enough to be worth carrying.
#
# It arrived red on purpose: the maintainer chose a runner that starts failing over one that
# waits for a clean tree, because the tier 1 budget check added by T-115 leaves a two-character
# margin and nothing else bounds how long a breach goes unseen.
#
# The first run (2026-08-10) failed seven assertions across `tests/test_cli.py` and
# `tests/test_runtime.py`, all of them one defect - T-112, a quoted `index` row whose target
# was abridged to three dots, which Windows resolves and Linux does not, so `check` was clean
# on the development machine and exited 1 here. That baseline was NOT the four failures known
# on Windows, which is what this file claimed before anyone had run it: three of those (T-114)
# do not reproduce on Linux at all.
#
# T-112 closed the same day and this job went green, which is what its record predicted. Note
# what that means for anyone reading a green run: it says the suite passes on Linux, and the
# four Windows failures are still open and are still invisible here.

name: tests

on:
  push:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags. The default is a shallow depth-1 checkout, which carries no
          # tags, and `tests/test_publishing.py` runs section 7's rule over the tag range
          # `v0.5.0..v0.6.0`. Without this the range cannot resolve (T-259).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run every test module
        # Deliberately does not stop at the first failure. The value of this job is which
        # modules fail, and `set -e` would report only the earliest one.
        run: |
          failed=""
          for module in tests/test_*.py; do
            echo "::group::$module"
            python "$module" || failed="$failed $module"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failing modules:$failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every module passed" | tee -a "$GITHUB_STEP_SUMMARY"
