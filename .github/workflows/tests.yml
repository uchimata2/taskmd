# Runs this repository's own test suite (T-116).
#
# It is not part of what an install copies: `plugin/` is the plugin boundary (T-053), and
# nothing in this file reaches an adopter.
#
# It arrives RED on purpose. The maintainer chose a runner that starts failing over one that
# waits for a clean tree, because the tier 1 budget check added by T-115 leaves a two-character
# margin and nothing else bounds how long a breach goes unseen. A run that fails ONLY the
# baseline below is the expected state; a run that fails anything else is a regression, and
# catching that is the whole point.
#
# Baseline, observed on the first run (2026-08-10): two modules fail, `tests/test_cli.py`
# with 6 and `tests/test_runtime.py` with 1, and all seven assertions have ONE cause -
# T-112. A task file quotes an `index` row with its target abridged to three dots; Windows
# resolves that path and Linux does not, so `check` is clean there and exits 1 here. Six of
# the seven are simply cases that run `check` over this repository and assert it passes.
#
# The baseline is therefore NOT the four failures known on Windows, which is what this file
# said before the first run. Three of those (T-114) do not reproduce here at all. Naming
# them would have been naming a set nobody had observed.
#
# When T-112 closes this job should go green. If it does not, that difference is a finding
# and belongs in a task, not in this comment.

name: tests

on:
  push:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run every test module
        # Deliberately does not stop at the first failure. The value of this job is which
        # modules fail, and `set -e` would report only the earliest one.
        run: |
          failed=""
          for module in tests/test_*.py; do
            echo "::group::$module"
            python "$module" || failed="$failed $module"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failing modules:$failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every module passed" | tee -a "$GITHUB_STEP_SUMMARY"
